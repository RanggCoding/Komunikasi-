<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Channel Web Walkie-Talkie</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Modular v13.2.0 sesuai konfigurasi Anda) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyB-PLp7Y5hDkOEgj410ubuULunXJQSfu2o",
            authDomain: "walkie-talkie-c57d0.firebaseapp.com",
            databaseURL: "https://walkie-talkie-c57d0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "walkie-talkie-c57d0",
            storageBucket: "walkie-talkie-c57d0.firebasestorage.app",
            messagingSenderId: "466646524005",
            appId: "1:466646524005:web:2e9b4dd11a9ccf5b6ce68c",
            measurementId: "G-KCQETGB3YC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ID Unik untuk setiap sesi browser (agar tidak mendengar suara sendiri)
        const clientId = 'user_' + Math.random().toString(36).substring(2, 9);
        
        let mediaRecorder;
        let audioChunks = [];
        let currentChannel = "channel-1";

        const pttBtn = document.getElementById('ptt-btn');
        const led = document.getElementById('led');
        const statusText = document.getElementById('status-text');
        const channelSelect = document.getElementById('channel-select');
        const infoText = document.getElementById('info-text');

        // Ganti channel saat dropdown diubah
        channelSelect.addEventListener('change', (e) => {
            currentChannel = e.target.value;
            infoText.textContent = `Pindah ke ${channelSelect.options[channelSelect.selectedIndex].text}`;
            subscribeChannel(currentChannel);
        });

        // Efek suara Squelch (Krrrk)
        function playSquelch() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = ctx.sampleRate * 0.12;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;

                noise.connect(filter);
                filter.connect(ctx.destination);
                noise.start();
            } catch(e) {}
        }

        // Inisialisasi Mikrofon
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = e => {
                    audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        const base64Audio = reader.result;
                        // Kirim ke Firebase Realtime Database berdasarkan channel aktif
                        const messagesRef = ref(db, `channels/${currentChannel}`);
                        push(messagesRef, {
                            sender: clientId,
                            audio: base64Audio,
                            timestamp: Date.now()
                        });
                    };
                    audioChunks = [];
                };
            })
            .catch(err => {
                alert("Gagal mengakses mikrofon!");
                infoText.textContent = "Izin mikrofon ditolak!";
            });

        // Tombol PTT
        function startTransmit(e) {
            e.preventDefault();
            if (!mediaRecorder || mediaRecorder.state === "recording") return;
            playSquelch();
            audioChunks = [];
            mediaRecorder.start();

            led.classList.remove('bg-red-600', 'shadow-[0_0_10px_red]');
            led.classList.add('bg-green-500', 'shadow-[0_0_15px_green]');
            statusText.textContent = "TRANSMITTING";
            statusText.className = "text-xs font-mono uppercase text-green-400 font-bold";
        }

        function stopTransmit(e) {
            e.preventDefault();
            if (!mediaRecorder || mediaRecorder.state !== "recording") return;
            mediaRecorder.stop();
            playSquelch();

            led.classList.remove('bg-green-500', 'shadow-[0_0_15px_green]');
            led.classList.add('bg-red-600', 'shadow-[0_0_10px_red]');
            statusText.textContent = "STANDBY";
            statusText.className = "text-xs font-mono uppercase text-slate-400";
        }

        window.addEventListener('DOMContentLoaded', () => {
            const pttBtn = document.getElementById('ptt-btn');
            pttBtn.addEventListener('mousedown', startTransmit);
            pttBtn.addEventListener('mouseup', stopTransmit);
            pttBtn.addEventListener('touchstart', startTransmit);
            pttBtn.addEventListener('touchend', stopTransmit);
        });

        // Listener Global untuk pesan masuk
        function subscribeChannel(channelName) {
            const channelRef = ref(db, `channels/${channelName}`);
            onChildAdded(channelRef, (snapshot) => {
                const data = snapshot.val();
                // Jika pengirim BUKAN diri sendiri, putar audionya
                if (data && data.sender !== clientId) {
                    playSquelch();
                    const audio = new Audio(data.audio);
                    audio.play().catch(e => console.log("Autoplay blocked"));
                }
            });
        }
        
        // Langganan awal ke channel 1
        subscribeChannel("channel-1");
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Kontainer Walkie Talkie -->
    <div class="bg-amber-700 border-4 border-amber-900 rounded-3xl p-6 shadow-2xl w-full max-w-xs flex flex-col items-center relative">
        
        <!-- Merek -->
        <div class="bg-amber-900 px-4 py-1 rounded-full text-xs font-bold tracking-widest text-amber-200 mb-4 shadow-inner">
            CB-MULTI 2026
        </div>

        <!-- Pemilih Channel -->
        <div class="w-full mb-4">
            <label class="block text-[10px] uppercase font-mono text-amber-200 mb-1">Pilih Channel:</label>
            <select id="channel-select" class="w-full bg-amber-950 border border-amber-900 text-white text-xs rounded-lg p-2 font-mono focus:outline-none">
                <option value="channel-1">Channel 1 (Frekuensi 144.00 MHz)</option>
                <option value="channel-2">Channel 2 (Frekuensi 146.50 MHz)</option>
                <option value="channel-3">Channel 3 (Frekuensi 148.20 MHz)</option>
            </select>
        </div>

        <!-- Speaker Grill -->
        <div class="w-32 bg-amber-950 rounded-lg p-2 mb-6 flex flex-col gap-1.5 shadow-inner">
            <div class="h-1 bg-amber-900 rounded"></div>
            <div class="h-1 bg-amber-900 rounded"></div>
            <div class="h-1 bg-amber-900 rounded"></div>
            <div class="h-1 bg-amber-900 rounded"></div>
        </div>

        <!-- Panel Status -->
        <div class="bg-slate-950 border-2 border-slate-800 rounded-xl p-4 w-full text-center mb-6 shadow-inner">
            <div class="items-center justify-center gap-2 mb-2 flex">
                <div id="led" class="w-4 h-4 rounded-full bg-red-600 shadow-[0_0_10px_red] transition-all"></div>
                <span id="status-text" class="text-xs font-mono uppercase text-slate-400">Standby</span>
            </div>
            <p id="info-text" class="text-[11px] text-slate-500">Tahan PTT untuk bicara di channel aktif</p>
        </div>

        <!-- Tombol PTT -->
        <button id="ptt-btn" class="w-28 h-28 bg-red-600 hover:bg-red-500 active:bg-red-700 border-4 border-red-800 rounded-full shadow-[0_8px_0_#7f1d1d] active:shadow-[0_2px_0_#7f1d1d] active:translate-y-2 transition-all flex items-center justify-center text-white font-black text-lg tracking-wider cursor-pointer select-none">
            PTT
        </button>

        <!-- Antena -->
        <div class="absolute -top-12 right-8 w-2 h-14 bg-slate-400 rounded-t-full border border-slate-500 -rotate-12"></div>
    </div>

</body>
</html>
